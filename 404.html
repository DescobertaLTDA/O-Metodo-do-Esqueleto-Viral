<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página não encontrada — Esqueleto Viral</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/logo/logo_1_teste.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#040008;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;background-image:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(255,90,0,0.08) 0%,transparent 70%)}
.err-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:48px;text-decoration:none}
.err-logo img{width:30px;height:30px;object-fit:contain}
.err-logo-text{font-size:13px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.55)}
.err-logo-text span{color:#FF5A00}
.err-code{font-size:clamp(80px,20vw,150px);font-weight:900;line-height:1;letter-spacing:-4px;background:linear-gradient(135deg,#FF5A00,#FFC478);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
.err-title{font-size:clamp(18px,4vw,26px);font-weight:800;color:rgba(255,255,255,0.85);letter-spacing:-0.5px;margin-bottom:12px}
.err-sub{font-size:14px;color:rgba(255,255,255,0.38);line-height:1.8;max-width:360px;margin:0 auto 36px}
.err-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#FF5A00,#FFC478);color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:13px 28px;border-radius:10px;text-decoration:none;box-shadow:0 4px 24px rgba(180,70,0,0.45);transition:transform .2s,box-shadow .2s}
.err-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(255,90,0,0.55)}
</style>
<script>
(function(){
  var l = window.location;
  var path = l.pathname.replace(/\/$/, '') || '/';

  // ── Aliases: redireciona atalhos curtos para as URLs reais
  var aliases = {
    '/contato':    '/paginas/contato/',
    '/privacidade':'/paginas/privacidade/',
    '/obrigado':   '/paginas/obrigado/',
    '/prompts':    '/cursos/prompts/',
  };
  if (aliases[path]) {
    l.replace(aliases[path]);
    return;
  }

  // ── Tudo o mais: exibe a página 404 amigável (não redireciona)
})();
</script>
</head>
<body>
  <a class="err-logo" href="/">
    <img src="/assets/logo/logo_1_teste.webp" alt="Esqueleto Viral">
    <span class="err-logo-text">ESQUELETO <span>VIRAL</span></span>
  </a>
  <div class="err-code">404</div>
  <h1 class="err-title">Página não encontrada</h1>
  <p class="err-sub">O endereço que você digitou não existe. Mas o método funciona — volte para a página principal e comece agora.</p>
  <a class="err-btn" href="/">← Voltar ao início</a>
</body>
</html>
