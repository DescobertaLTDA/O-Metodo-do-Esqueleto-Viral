<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutinhas Virais | Esqueleto Viral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="components.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05000b;--text:#f5f0ff;--muted:rgba(245,240,255,.6);--p:#a855f7;--p2:#c084fc}
body{font-family:'Montserrat',sans-serif;background:radial-gradient(ellipse at 70% 20%,rgba(168,85,247,.25),transparent 50%),var(--bg);color:var(--text);overflow-x:hidden}
.urgency-banner{background:#000;border-bottom:1px solid rgba(168,85,247,.15);text-align:center;padding:10px 20px;font-size:11.5px;font-weight:700;letter-spacing:1px;color:rgba(245,240,255,.55);margin-top:72px;display:flex;align-items:center;justify-content:center;gap:10px}
.hero{min-height:100vh;display:flex;align-items:center;padding:44px 120px 80px;gap:60px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 90% 70% at 65% 55%,rgba(168,85,247,.38) 0%,rgba(91,33,182,.18) 35%,transparent 70%);pointer-events:none}
.hero-content{position:relative;z-index:2;flex:0 0 48%;max-width:520px}
.hero-tag{display:inline-flex;gap:8px;align-items:center;padding:7px 16px;background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.25);border-radius:6px;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--p2)}
h1{margin-top:18px;font-size:clamp(40px,5.5vw,78px);line-height:.95;letter-spacing:-2px;text-transform:uppercase}
h1 span{display:block;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{margin-top:18px;font-size:16px;line-height:1.7;color:var(--muted)}
.btn{margin-top:30px;display:inline-flex;padding:18px 34px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;text-decoration:none;font-weight:900;font-size:13px;letter-spacing:2px;text-transform:uppercase;box-shadow:0 12px 34px rgba(168,85,247,.45)}
.trust{margin-top:14px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:rgba(245,240,255,.45)}
.cards{position:relative;z-index:2;flex:1;min-height:500px}
.card{position:absolute;width:280px;border-radius:20px;overflow:hidden;border:1px solid rgba(168,85,247,.35);box-shadow:0 26px 60px rgba(0,0,0,.52)}
.card img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}
.c1{left:8%;top:54px;transform:rotate(-12deg);animation:f1 4.6s ease-in-out infinite}
.c2{left:34%;top:10px;transform:rotate(0deg);z-index:2;animation:f2 4.2s ease-in-out infinite}
.c3{left:60%;top:54px;transform:rotate(12deg);animation:f3 4.8s ease-in-out infinite}
@keyframes f1{0%,100%{transform:rotate(-12deg) translateY(0)}50%{transform:rotate(-12deg) translateY(-12px)}}
@keyframes f2{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(0) translateY(-16px)}}
@keyframes f3{0%,100%{transform:rotate(12deg) translateY(0)}50%{transform:rotate(12deg) translateY(-10px)}}
@media(max-width:960px){
  .urgency-banner{margin-top:58px;font-size:11px}
  .hero{padding:0;display:block;min-height:calc(100vh - 58px);position:relative}
  .hero::before{display:none}
  .hero-mobile-bg{position:absolute;inset:0;z-index:0;background:url('/frutinhas/assets/img/hero_frutas.jpeg') center -56px/cover no-repeat}
  .hero-mobile-bg::after{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(0,0,0,.05) 0%,rgba(5,0,8,.35) 48%,rgba(5,0,8,.88) 70%,#05000b 92%);
  }
  .hero-content{
    max-width:none;width:100%;
    padding:0 20px 42px;
    text-align:center;
    position:relative;z-index:2;
    margin-top:46vh;
  }
  .hero-tag{display:none}
  h1{font-size:clamp(36px,11vw,56px);letter-spacing:-1px;text-shadow:0 4px 18px rgba(0,0,0,.45)}
  .hero-sub{font-size:14px;margin-top:10px;color:rgba(245,240,255,.92);text-shadow:0 2px 10px rgba(0,0,0,.5)}
  .btn{margin-top:18px;width:100%;max-width:320px;justify-content:center;padding:16px 22px}
  .trust{justify-content:center;gap:10px;font-size:10px;margin-top:10px;color:rgba(245,240,255,.75)}
  .cards{display:none}
}
</style>
</head>
<body>
<div id="ev-header"></div>
<div class="urgency-banner">• 13 vagas restantes · <strong style="color:#fff">R$35,00</strong></div>
<section class="hero">
  <div class="hero-mobile-bg"></div>
  <div class="hero-content">
    <div class="hero-tag">🍓 Frutinhas Virais · Entrega Imediata</div>
    <h1>frutinhas <span>virais</span></h1>
    <p class="hero-sub">Método direto para criar conteúdo que prende atenção e escala visualizações com IA, sem aparecer e sem edição complexa.</p>
    <a class="btn kiwify-link" data-kiwify-curso href="https://pay.kiwify.com.br/HM1g0Nv" target="_blank" rel="noopener">Quero começar agora</a>
    <div class="trust"><span>🔒 Garantia 7 dias</span><span>🔒 Acesso imediato</span><span>♾️ Acesso vitalício</span></div>
  </div>
  <div class="cards">
    <div class="card c1"><img src="/prompts/assets/img/img1.jpeg" alt="Frutinhas 1"></div>
    <div class="card c2"><img src="/frutinhas/assets/img/hero_frutas.jpeg" alt="Frutinhas 2"></div>
    <div class="card c3"><img src="/prompts/assets/img/img3.jpeg" alt="Frutinhas 3"></div>
  </div>
</section>
<div id="ev-footer"></div>
</body>
</html>
